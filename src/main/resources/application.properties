spring.application.name=graphrag-fundamentals

#neo4j connection
spring.neo4j.uri=neo4j+s://demo.neo4jlabs.com
spring.neo4j.authentication.username=companies2
spring.neo4j.authentication.password=companies2
spring.data.neo4j.database=companies2

#openai connection
spring.ai.openai.api-key=${OPENAI_KEY}
spring.ai.openai.embedding.model=text-embedding-3-small

#vector store config
spring.ai.vectorstore.neo4j.label=Chunk
spring.ai.vectorstore.neo4j.index-name=news_openai_small
spring.ai.vectorstore.neo4j.embedding-property=embedding_3_small
spring.ai.vectorstore.neo4j.initialize-schema=false

logging.level.org.springframework.ai=DEBUG

#MCP config - demo purpose
spring.ai.mcp.client.stdio.servers-configuration=classpath:mcp-servers.json
spring.ai.mcp.client.stdio.enabled=true
